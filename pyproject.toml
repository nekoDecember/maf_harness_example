[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maf-harness-1170-sample"
version = "0.1.0"
description = "A small stable-host-supervised Microsoft Agent Framework 1.17.0 Harness CLI sample"
requires-python = ">=3.10"
dependencies = [
  "agent-framework-core==1.17.0",
  "agent-framework-openai==1.14.2",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
maf-harness = "harness_cli:main"

[tool.hatch.build.targets.wheel]
include = ["harness_cli.py", "harness_agent.py", "harness_state.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
